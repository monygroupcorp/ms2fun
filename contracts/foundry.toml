[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Deploy-determinism: the money contracts (^0.8.20 src) MUST compile under ONE pinned
# solc so the deployed bytecode is never ambiguous. Do NOT re-enable auto_detect_solc on
# the default (deploy) profile — the real-v4 RealSettlement test imports v4-core's real
# PoolManager (exact pragma 0.8.26), which would silently float the default compiler off
# 0.8.28. That regression is what noesis-120 fixes: the RealSettlement test is skip-excluded
# here and runs under the companion config `foundry.v4.toml` (auto-detect) instead.
solc = "0.8.28"
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"
gas_reports = ["*"]
test = "test"
script = "script"
broadcast = "broadcast"
fs_permissions = [
    { access = "read-write", path = "./deployments/" },
    # Read-only so the `test/audit` suppression census can enumerate and read `src/` in-process
    # (`vm.readDir`/`vm.readFile`) instead of shelling out. All named profiles inherit
    # `[profile.default]`, so `FOUNDRY_PROFILE=ci` picks this up unchanged.
    { access = "read", path = "./src/" },
]
# The `test/audit` suppression census reads every `.sol` under `src/` in one call and splits each into
# lines. Solidity never reclaims memory, so the run's memory-expansion GAS — which grows quadratically
# — scales with the SIZE OF THE TREE rather than with anything the test does. On foundry's default
# `gas_limit` of 2^30 that was already close enough to the edge that ~800 bytes of added comments in a
# single source file spent the remaining headroom and reverted it as `EvmError: MemoryOOG`, an error
# that names no file, no line and no assertion. The guard is right; its budget was sized for a smaller
# `src`. If this is hit again, raise it again or make the census stream file-by-file — do NOT shrink
# source comments to fit a test's gas budget.
gas_limit = 4294967296
# These import v4-core's real PoolManager (exact pragma 0.8.26), which cannot compile under the
# pinned 0.8.28 default. Excluding a file here drops it from the default compile set and so from
# every job that uses it — which is the whole of CI bar one. The one is scripts/real-v4-gate.sh,
# run by contracts-ci's `real-settlement` job and before pushing, and it is
# where a file listed below is either run or recorded as deliberately not run. It refuses if a
# name here is missing from it, because a file skipped and unnamed there is a test nothing on
# earth executes, and nothing goes red to say so.
skip = [
    "test/hooks/UniAlignmentV4Hook_RealSettlement.t.sol",
    # Same reason — these three audit proofs drive the real PoolManager:
    "test/audit/HookQueuedFeesMigratedVault.t.sol",
    "test/audit/HookSecondPoolNotBound.t.sol",
    "test/audit/UniVaultPoolKeyRotation.t.sol",
    # DIFFERENT reason, and it is now the only file left under it. This group held the
    # 2026-09-17 pre-testnet audit's reproductions of defects that were still OPEN: they
    # assert the property the code SHOULD hold, so they FAIL on purpose, and a failing
    # test in the default set would make the contracts gate red for a defect the gate did
    # not cause. Every one of those fixes has since landed and its proof has left this
    # group. The one below is NOT waiting for a fix and must not be read as an open
    # defect: H-1 is ruled as designed (rth, 2026-09-17), so this proof asserts a solvency
    # property the protocol does not offer and stays red for as long as the ruling stands.
    # It is kept, and kept out of the gate, as the record of what the mechanism costs —
    # see §2 and §4 of contracts/audits/2026-09-17-pre-testnet.md. The proofs that measure
    # the RULED behaviour and do run in the gate are BondingCurveFreeMintInvariant.t.sol
    # and FreeMintReserveDrain.t.sol.
    #
    # So do NOT delete its line to let the gate keep it honest: nothing under src/ will
    # ever turn it green while the ruling stands, and deleting it makes the gate
    # permanently red.
    #
    # If a line is ever added here for an open defect again: WHEN ITS FIX LANDS, DELETE IT
    # — the proof turning green is how the fix is shown to work, and a proof left skipped
    # is a fix nobody verified. Until then it goes in scripts/real-v4-gate.sh's OUT table
    # with that reason, or the gate refuses.
    "test/audit/FreeMintCurveSolvency.t.sol",
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "solady/=lib/solady/src/",
    "solmate/=lib/solmate/",
    "v4-core/=lib/v4-core/src/",
    "v4-core/test/=lib/v4-core/test/",
    "dn404/=lib/dn404/",
    "@uniswap/v3-core/=lib/v3-core/contracts/",
    "@uniswap/v3-periphery/=lib/v3-periphery/contracts/",
    "@uniswap/v2-core/=lib/v2-core/contracts/",
    "zamm/=lib/zamm/src/",
    "zRouter/=lib/zRouter/src/",
    "createx-forge/=lib/createx-forge/",
    "aave-address-book/=lib/aave-address-book/src/"
]

# Run counts live under their own tables (`[fuzz] runs` / `[invariant] runs`), not as flat
# `fuzz_runs`/`invariant_runs` keys — the flat form is silently ignored (forge emits an
# unknown-key warning).
#
# THREE profiles, and each one says here what selects it. `ci` and `deep` are the run-count
# tables immediately below; `fork` is at the bottom of this file.
#
#   `ci`   — selected by contracts-ci.yml's `Run tests` step (`FOUNDRY_PROFILE=ci forge test`).
#            Elevated fuzz depth; invariant runs left at the default so the per-push job stays
#            inside a per-push budget.
#   `fork` — NOT selected by any workflow, and cannot be: every suite it confines needs a live
#            RPC endpoint, which no job here holds. Run by hand, against mainnet:
#              FOUNDRY_PROFILE=fork forge test --fork-url "$MAINNET_RPC_URL"
#            What the profile adds over the default is the `match_path` confinement to
#            `test/fork/**` and `verbosity = 2`; the suites themselves are NOT excluded from the
#            default profile, and each gates on its own RPC variable and skips when it is unset,
#            which is why they show as skips in the per-push run rather than as failures. So a
#            fork suite that stops COMPILING is caught per push; a fork suite that stops PASSING
#            is caught only by the hand run above. Note that `scripts/test-fork.sh` runs the same
#            files against a local anvil WITHOUT selecting this profile — it gets
#            `[profile.default]` — so the two are not interchangeable.
#   `deep` — selected by contracts-deep-invariant.yml, weekly and on demand, one hosted runner
#            per invariant suite. Locally it is `scripts/deep-invariant.sh`, the same script
#            that workflow calls, so the suite list and the command have exactly one copy.
#            Elevated invariant depth: about 39x the run count the per-push gate uses.
#
#            It is off the per-push gate because of what that costs. Measured 2026-08-12 on the
#            pinned forge 1.5.1-stable, 32 cores: a whole-tree run was killed at 61 min WITHOUT
#            finishing (six invariant suites completed, together ~7.9 CPU-hours; the heaviest,
#            BondingCurveInvariant, was still running). The default-profile whole-tree run is
#            ~2 min on the same host for comparison. Hence weekly, and hence one invocation per
#            suite rather than whole-tree: a suite that finished is a number that can be quoted,
#            and that 61-minute attempt produced none for any suite — not even for the six that
#            had in fact finished, because nothing reported until the last one did.
#
# A profile with no selector is not a gate. If a new profile is added here, wire it or say
# where it is run by hand — and add it to the inventory above, which is the part that was
# skipped last time: `fork` sat in this file unlisted and unmentioned, and so nobody noticed
# that its gas limit had stopped two of its suites from reaching a single assertion. Two lines
# in the list above are the cheapest thing that would have caught it.
#
# QUOTE NO PASS/FAIL NUMBER FOR A RUN THAT DID NOT COMPLETE. A suite cancelled at a timeout is
# not a pass, and a whole-tree run still going is not a result. The first complete run was
# observed 2026-09-23 and its numbers — 54 invariant properties, 54 passed, 270M calls — are
# recorded in entry 2 of `docs/PRE-MAINNET-CHECKLIST.md`, which must be read before any mainnet
# deploy. Quote those, not a recollection.
[profile.ci.fuzz]
runs = 1000

[profile.deep.fuzz]
runs = 1000

[profile.deep.invariant]
runs = 10000

[profile.fork]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"

# Fork configuration
# eth_rpc_url should be passed via --fork-url flag or loaded from .env
# fork_block_number = 21000000 # Old block, V4 liquidity limited
# Use latest block for V4 testing (December 2025)
#
# NO `gas_limit` here, deliberately — this profile inherits `[profile.default]`'s.
#
# It used to carry `gas_limit = 30000000`, a mainnet BLOCK gas limit. A forge test is not a
# block: the test contract's own deployment and the whole test body are charged against this
# one number. The deploy-rehearsal fork suites construct the deploy script in-process
# (`new DeployCore()`, `new DeployMainnetHarness()`), which embeds each script's entire
# creation code in the test contract's own runtime code — HUNDREDS OF KILOBYTES of it, since
# EIP-170's 24 KB cap does not apply to a forge test contract and so nothing refuses it. Code
# deposit is 200 gas/byte, so DEPLOYING THAT TEST CONTRACT costs several times a whole block's
# worth of gas before a single line of it runs, and the rehearsal then spends more still
# deploying the protocol for real. Under a 30M limit the suite died as `EvmError: OutOfGas` on
# `constructor()` at `gas: 0` — no file, no line, no assertion, and no test body ever reached.
#
# Deliberately no figure quoted for that: it is a number that rots, and it only ever rots
# upward. Measure it when you need it — `forge build`, then the `deployedBytecode` length in
# `out/AaveEndowmentMainnetFork.t.sol/AaveEndowmentMainnetForkTest.json`, times 200 gas. For
# scale at the time of writing it read 773,940 bytes, ~154.8M gas — five times a mainnet block.
#
# The script is what grows: `DeployCore` has taken on the endowment family, the best-route
# quoter, the curation surface and the preset ladder since this profile was written, and every
# further family it deploys adds to the creation code a test embeds by naming it. 30M was never
# sized against that; it was copied from what a chain will accept in one block.
#
# So do NOT reintroduce a block-sized limit here. If a fork test must assert that some
# operation fits in a real block, measure it with `gasleft()` and assert the measurement —
# `test/fork/VaultUniswapIntegration.t.sol:775` already does exactly that, and such an
# assertion is unaffected by this number.
verbosity = 2

# Only run fork tests with this profile
match_path = "test/fork/**/*.sol"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
