[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Deploy-determinism: the money contracts (^0.8.20 src) MUST compile under ONE pinned
# solc so the deployed bytecode is never ambiguous. Do NOT re-enable auto_detect_solc on
# the default (deploy) profile — the real-v4 RealSettlement test imports v4-core's real
# PoolManager (exact pragma 0.8.26), which would silently float the default compiler off
# 0.8.28. That regression is what noesis-120 fixes: the RealSettlement test is skip-excluded
# here and runs under the companion config `foundry.v4.toml` (auto-detect) instead.
solc = "0.8.28"
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"
gas_reports = ["*"]
test = "test"
script = "script"
broadcast = "broadcast"
fs_permissions = [
    { access = "read-write", path = "./deployments/" },
    # Read-only so the `test/audit` suppression census can enumerate and read `src/` in-process
    # (`vm.readDir`/`vm.readFile`) instead of shelling out. All named profiles inherit
    # `[profile.default]`, so `FOUNDRY_PROFILE=ci` picks this up unchanged.
    { access = "read", path = "./src/" },
]
# The `test/audit` suppression census reads every `.sol` under `src/` in one call and splits each into
# lines. Solidity never reclaims memory, so the run's memory-expansion GAS — which grows quadratically
# — scales with the SIZE OF THE TREE rather than with anything the test does. On foundry's default
# `gas_limit` of 2^30 that was already close enough to the edge that ~800 bytes of added comments in a
# single source file spent the remaining headroom and reverted it as `EvmError: MemoryOOG`, an error
# that names no file, no line and no assertion. The guard is right; its budget was sized for a smaller
# `src`. If this is hit again, raise it again or make the census stream file-by-file — do NOT shrink
# source comments to fit a test's gas budget.
gas_limit = 4294967296
# These import v4-core's real PoolManager (exact pragma 0.8.26), which cannot compile under the
# pinned 0.8.28 default. Excluding a file here drops it from the default compile set and so from
# every job that uses it — which is the whole of CI bar one. The one is scripts/real-v4-gate.sh,
# run by contracts-ci's `real-settlement` job and before pushing, and it is
# where a file listed below is either run or recorded as deliberately not run. It refuses if a
# name here is missing from it, because a file skipped and unnamed there is a test nothing on
# earth executes, and nothing goes red to say so.
skip = [
    "test/hooks/UniAlignmentV4Hook_RealSettlement.t.sol",
    # Same reason — these three audit proofs drive the real PoolManager:
    "test/audit/HookQueuedFeesMigratedVault.t.sol",
    "test/audit/HookSecondPoolNotBound.t.sol",
    "test/audit/UniVaultPoolKeyRotation.t.sol",
    # DIFFERENT reason, and it is now the only file left under it. This group held the
    # 2026-09-17 pre-testnet audit's reproductions of defects that were still OPEN: they
    # assert the property the code SHOULD hold, so they FAIL on purpose, and a failing
    # test in the default set would make the contracts gate red for a defect the gate did
    # not cause. Every one of those fixes has since landed and its proof has left this
    # group. The one below is NOT waiting for a fix and must not be read as an open
    # defect: H-1 is ruled as designed (rth, 2026-09-17), so this proof asserts a solvency
    # property the protocol does not offer and stays red for as long as the ruling stands.
    # It is kept, and kept out of the gate, as the record of what the mechanism costs —
    # see §2 and §4 of contracts/audits/2026-09-17-pre-testnet.md. The proofs that measure
    # the RULED behaviour and do run in the gate are BondingCurveFreeMintInvariant.t.sol
    # and FreeMintReserveDrain.t.sol.
    #
    # So do NOT delete its line to let the gate keep it honest: nothing under src/ will
    # ever turn it green while the ruling stands, and deleting it makes the gate
    # permanently red.
    #
    # If a line is ever added here for an open defect again: WHEN ITS FIX LANDS, DELETE IT
    # — the proof turning green is how the fix is shown to work, and a proof left skipped
    # is a fix nobody verified. Until then it goes in scripts/real-v4-gate.sh's OUT table
    # with that reason, or the gate refuses.
    "test/audit/FreeMintCurveSolvency.t.sol",
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "solady/=lib/solady/src/",
    "solmate/=lib/solmate/",
    "v4-core/=lib/v4-core/src/",
    "v4-core/test/=lib/v4-core/test/",
    "dn404/=lib/dn404/",
    "@uniswap/v3-core/=lib/v3-core/contracts/",
    "@uniswap/v3-periphery/=lib/v3-periphery/contracts/",
    "@uniswap/v2-core/=lib/v2-core/contracts/",
    "zamm/=lib/zamm/src/",
    "zRouter/=lib/zRouter/src/",
    "createx-forge/=lib/createx-forge/",
    "aave-address-book/=lib/aave-address-book/src/"
]

# Run counts live under their own tables (`[fuzz] runs` / `[invariant] runs`), not as flat
# `fuzz_runs`/`invariant_runs` keys — the flat form is silently ignored (forge emits an
# unknown-key warning).
#
# TWO profiles, and each one is selected by something that actually runs:
#
#   `ci`   — selected by contracts-ci.yml's `Run tests` step (`FOUNDRY_PROFILE=ci forge test`).
#            Elevated fuzz depth; invariant runs left at the default so the per-push job stays
#            inside a per-push budget.
#   `deep` — NOT selected by any workflow. Elevated invariant depth, run by hand:
#              FOUNDRY_PROFILE=deep forge test
#            Measured 2026-08-12 on the pinned forge 1.5.1-stable, 32 cores: the whole-tree run
#            passed 61 min without finishing (six invariant suites completed, together ~7.9 CPU-
#            hours; the heaviest, BondingCurveInvariant, was still running). Selecting these
#            counts per push, or on a 4-core hosted runner, is not viable — hence a hand-run
#            profile rather than a workflow step. The default-profile whole-tree run is ~2 min
#            on the same host for comparison.
#
# A profile with no selector is not a gate. If a new profile is added here, wire it or say
# where it is run by hand.
#
# `deep` having no selector is a deliberate, tracked deferral, not an oversight: it is entry 2
# of `docs/PRE-MAINNET-CHECKLIST.md`, which must be read before any mainnet deploy. It
# discharges only when the profile runs on a schedule AND a complete pass/fail has been
# observed. Until then, quote no pass/fail number for this profile.
[profile.ci.fuzz]
runs = 1000

[profile.deep.fuzz]
runs = 1000

[profile.deep.invariant]
runs = 10000

[profile.fork]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"

# Fork configuration
# eth_rpc_url should be passed via --fork-url flag or loaded from .env
# fork_block_number = 21000000 # Old block, V4 liquidity limited
# Use latest block for V4 testing (December 2025)
gas_limit = 30000000
verbosity = 2

# Only run fork tests with this profile
match_path = "test/fork/**/*.sol"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
