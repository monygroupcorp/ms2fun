<!doctype html>
<html lang="en" data-brand="noesis">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      Content-Security-Policy. This app renders two kinds of content it does not author: bytes a
      public IPFS/Arweave gateway returns, and URIs whoever deployed a collection wrote into its
      metadata. The policy is the browser-enforced backstop under the parse-time URI allowlist in
      `src/lib/metadata/untrusted.ts`.

      Deliberate choices, with their costs:
      * `img-src` / `connect-src` admit `https:` as a whole rather than naming the gateway roster.
        A user may point the app at their own IPFS gateway (a pasted URL, kept in local storage),
        and an RPC endpoint is configuration too — an enumerated roster would break both the day it
        was used, silently and only for that user. The cost is that this directive does not itself
        constrain WHICH host an image comes from; the URI allowlist is what does that, by refusing
        author-chosen remote pointers before they ever reach an `<img>`.
      * `script-src` keeps `'unsafe-inline'`. This meta policy is served in development too, where
        the React refresh preamble is an inline script; without it the dev server does not run. What
        the directive still buys is that no THIRD-PARTY script origin can execute here. Dropping
        `'unsafe-inline'` needs the policy to move to a response header or a build-only transform,
        which is where it should end up.
      * `object-src`/`frame-src` are `'none'`: gateway bytes must never reach a plugin or a frame,
        and nothing in the app uses either. `base-uri`/`form-action` are pinned to `'self'`.
      * `style-src` keeps `'unsafe-inline'` because a collection's `styleUri` CSS is injected as a
        <style> element (see ProjectStyle) and CSS modules inline styles in development.
      `frame-ancestors` is deliberately absent: it is ignored in a meta policy and belongs on a
      response header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' data: https: wss:"
    />
    <!--
      Asset hrefs below go through vite's base-url placeholder, never a leading `/`. Vite
      substitutes the resolved `base`: `/` for the ms2.fun build (these emit exactly the paths they
      emitted before) and `./` for the IPFS distribution build, where the document is served from
      under a `/ipfs/<cid>/` path prefix and a root-anchored href would leave the pin entirely.
      The og:/twitter: URLs below stay ABSOLUTE on purpose — a share card is fetched by a scraper
      with no page context, so those have to name an origin.
    -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="description"
      content="noesis — onchain alignment launchpad. Curated art/token releases bound, by contract, to the communities that inspired them."
    />
    <!--
      Share card tags (og:/twitter:). The origin below tracks launch/launch-runbook.md — update
      both together if it changes. These are SITE-WIDE and STATIC on purpose: this is a serverless
      SPA (no server render), scrapers do not execute JS, so every route serves this same card
      regardless of what React sets after hydration. Do not move this into a component.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="noesis" />
    <meta property="og:title" content="noesis — onchain alignment launchpad" />
    <meta
      property="og:description"
      content="noesis — onchain alignment launchpad. Curated art/token releases bound, by contract, to the communities that inspired them."
    />
    <meta property="og:url" content="https://noesis.gwei.domains" />
    <meta property="og:image" content="https://noesis.gwei.domains/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="the noesis mark — a picture-frame lockup" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="noesis — onchain alignment launchpad" />
    <meta
      name="twitter:description"
      content="noesis — onchain alignment launchpad. Curated art/token releases bound, by contract, to the communities that inspired them."
    />
    <meta name="twitter:image" content="https://noesis.gwei.domains/icon-512.png" />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
    <title>noesis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
