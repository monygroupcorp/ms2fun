name: app-ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # G1 — TypeScript strict, zero errors
      - name: Typecheck (G1)
        run: pnpm typecheck

      # G2 — No `any`, no unexplained @ts-ignore
      - name: Lint (G2)
        run: pnpm lint

      # G3 — Format clean
      - name: Format check (G3)
        run: pnpm format:check

      # G4 — Unit tests green
      - name: Test (G4)
        run: pnpm test

      # G5 — Production build succeeds
      - name: Build (G5)
        run: pnpm build

      # G6 — No app/ → legacy/ imports (grep runs from repo root)
      - name: No legacy imports (G6)
        working-directory: ${{ github.workspace }}
        run: "! grep -rEq \"from ['\\\"].*legacy/\" app/src"

      # G7 — Generated-code determinism: committed wagmi bindings must not drift
      # from committed contracts/src. We build the contracts from source, regenerate
      # the bindings from the fresh out/, and fail on ANY diff vs the committed file.
      #
      # Why the explicit dep install: contracts/lib is gitignored with NO committed
      # submodule gitlinks, so actions/checkout fetches nothing and the deps have to be
      # cloned here.
      # `install-libs.sh src` installs the subset src/ compiles against, pinned to exact
      # commits in contracts/scripts/lib-pins.txt — the same file contracts-ci installs
      # from, so a drift gate cannot be comparing bindings built from different dependency
      # code than the contracts gate compiled. The `src` scope deliberately omits forge-std
      # and aave-address-book: the glob-form `--skip "*/test/**" "*/script/**"` builds only
      # src/, which imports neither (test/ + script/ only). The glob form (not the bare
      # word-form `--skip test script`) is required to exclude deps' OWN nested test dirs:
      # lib/dn404 vendors its own forge-std under test/, which the word-form does not skip
      # (CI errors "Declaration `console` not found"). Forge is PINNED to v1.5.1 because
      # `--skip` glob semantics differ across releases: nightly red'd where v1.5.1 is green.
      - name: Install Foundry (G7)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install contracts/lib deps (G7)
        working-directory: contracts
        run: ./scripts/install-libs.sh src

      - name: Build contracts (G7)
        working-directory: contracts
        run: forge build --skip "*/test/**" "*/script/**" "src/vaults/zamm/**"

      - name: Regenerate wagmi bindings (G7)
        run: pnpm wagmi:generate

      - name: Bindings drift gate (G7)
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code app/src/generated/contracts.ts

      # The Playwright e2e suite (app/e2e/) is NOT part of this workflow. Most of its specs are
      # tagged @fork and read an anvil mainnet-fork on :8545 with the platform contracts deployed,
      # which needs a fork RPC endpoint this workflow does not have. It is documented as a local
      # gate in docs/ARCHITECTURE.md §5 and run with:
      #   cd app && pnpm chain:fork && pnpm chain:deploy && pnpm test:e2e
      # Adding it here means providing that endpoint to the job first.
