name: app-ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # G1 — TypeScript strict, zero errors
      - name: Typecheck (G1)
        run: pnpm typecheck

      # G2 — No `any`, no unexplained @ts-ignore
      - name: Lint (G2)
        run: pnpm lint

      # G3 — Format clean
      - name: Format check (G3)
        run: pnpm format:check

      # G4 — Unit tests green
      - name: Test (G4)
        run: pnpm test

      # G5 — Production build succeeds
      - name: Build (G5)
        run: pnpm build

      # G6 — No app/ → legacy/ imports (grep runs from repo root)
      - name: No legacy imports (G6)
        working-directory: ${{ github.workspace }}
        run: "! grep -rEq \"from ['\\\"].*legacy/\" app/src"

      # G7 — Generated-code determinism: committed wagmi bindings must not drift
      # from committed contracts/src. We build the contracts from source, regenerate
      # the bindings from the fresh out/, and fail on ANY diff vs the committed file.
      #
      # Why the explicit forge install: contracts/lib is gitignored with NO committed
      # submodule gitlinks (contracts/.gitmodules is an orphaned manifest of URLs with
      # no commit pins), so actions/checkout fetches nothing. We clone each of the 11
      # declared deps by hand. The glob-form `--skip "*/test/**" "*/script/**"` builds
      # only src/, which imports none of forge-std / aave-address-book (test/ + script/
      # only), so the 11 deps suffice. The glob form (not the bare word-form
      # `--skip test script`) is required to exclude deps' OWN nested test dirs: lib/dn404
      # vendors its own forge-std under test/, which the word-form does not skip (CI errors
      # "Declaration `console` not found"). Forge is PINNED to v1.5.1 because `--skip` glob
      # semantics differ across releases: nightly red'd where v1.5.1 is green.
      # NOTE (known follow-up): deps are unpinned — forge install pulls default-branch
      # HEAD, so an upstream breaking change could red this gate with no local repro.
      # Proper fix = pin deps (foundry.lock / real gitlinks); tracked as a separate item.
      - name: Install Foundry (G7)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install contracts/lib deps (G7)
        working-directory: contracts
        run: |
          forge install \
            OpenZeppelin/openzeppelin-contracts \
            transmissions11/solmate \
            vectorized/solady \
            Uniswap/v4-core \
            vectorized/dn404 \
            Uniswap/v3-core \
            Uniswap/v3-periphery \
            Uniswap/v2-core \
            z-fi/zamm \
            z-fi/zRouter \
            radeksvarz/createx-forge

      - name: Build contracts (G7)
        working-directory: contracts
        run: forge build --skip "*/test/**" "*/script/**" "src/vaults/zamm/**"

      - name: Regenerate wagmi bindings (G7)
        run: pnpm wagmi:generate

      - name: Bindings drift gate (G7)
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code app/src/generated/contracts.ts

      # G8 (e2e) is added in a later task.
      # - name: Hello-chain e2e (G8)
      #   run: pnpm test:e2e
