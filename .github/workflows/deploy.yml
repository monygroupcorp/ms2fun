name: Deploy to GitHub Pages

# NOTE: the push trigger is intentionally disabled. This workflow still builds the RETIRED root
# stack (root `index.html` -> `/src/index.js`, root `vite.config.js`), and root `src/` no longer
# exists: a8ca295 moved it to `legacy/` and did not update the entry point. The build therefore
# fails at `Failed to resolve /src/index.js` on every run and has never once succeeded, so firing
# it on every push to main only produced a permanent red with nothing behind it.
#
# The frontend that should actually ship is `app/`, which app-ci already typechecks, tests and
# builds (gate G5) on every commit. Rewriting this workflow to publish `app/dist` is deliberately
# NOT part of this change: ms2.fun currently serves the old pre-quarantine artifact wired to the
# old contracts, and swapping what the brand domain serves is gated on the testnet deploy landing.
# Until then this stays manual-only via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
