name: Deploy to GitHub Pages

# What ms2.fun serves.
#
# It serves a redirect to the live site, and nothing else. The history matters for anyone
# reading this later: this workflow used to build the root stack (root `index.html` ->
# `/src/index.js`), and `a8ca295` moved root `src/` to `legacy/` without updating the entry
# point. Every run after that failed at `Failed to resolve /src/index.js`, so the last artifact
# Pages actually published was 2026-05-15 — a build wired to contracts that are no longer live.
# A visitor typing the brand name reached it for four and a half months.
#
# The frontend that ships is `app/`, and it is distributed as a pinned bundle rather than from
# here. Pointing the brand domain at that distribution is what this workflow now does: there is
# no build step, because a redirect has nothing to compile, which is also why it cannot rot back
# into a permanent red.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publish/ms2fun/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The redirect target is asserted here rather than trusted, so a bad edit to the page
      # fails the deploy instead of silently stranding every visitor on a blank document.
      - name: Assert the redirect names the live site
        run: |
          grep -q 'noesis.gwei.domains' publish/ms2fun/index.html
          grep -q 'noesis.gwei.domains' publish/ms2fun/404.html
          grep -qx 'ms2.fun' publish/ms2fun/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/ms2fun

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
