name: contracts-ci

# Path-filtered: every step below runs with working-directory: contracts and reads only
# contracts/** (forge install/build/test, the EIP-170 gate script, both foundry.toml
# profiles). app-ci is intentionally left unfiltered — its G7 step rebuilds contracts
# from source and diffs the generated wagmi bindings, so a contracts-only change must
# still run app-ci to catch bindings drift (app-ci.yml G7). This filter is one-directional
# for that reason. `main` currently has no branch protection (no required checks), so an
# absent run here reads as not-applicable rather than a stuck "Expected" check; revisit
# this filter if branch protection is ever added.
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'

defaults:
  run:
    working-directory: contracts

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Foundry PINNED to v1.5.1 to match app-ci.yml's G7: `--skip` glob semantics
      # differ across releases, and nightly reds where v1.5.1 is green. Keep the pin
      # identical so this job and G7 agree on the same toolchain behavior.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # contracts/lib is gitignored with NO committed submodule gitlinks, so
      # actions/checkout fetches nothing and every dependency has to be cloned here.
      # The revisions live in contracts/scripts/lib-pins.txt and are pinned to exact
      # commits, so this gate compiles the same dependency code on every run and an
      # upstream push cannot red it. `all` is the full set: the 11 that src/ needs plus
      # forge-std and aave-address-book, which `forge test` imports and a src-only build
      # does not. app-ci's G7 step installs the `src` subset from the same file, so the
      # two jobs cannot drift apart.
      - name: Install contracts/lib deps
        run: ./scripts/install-libs.sh all

      - name: Format check
        run: forge fmt --check

      # INV-1 (docs/RISK_REGISTER.md, contracts/docs/spec/ZROUTER_AMOUNTLIMIT.md): zRouter is a
      # shared permissionless router and every leg pulls its input with transferFrom, so any
      # allowance left standing on it is spendable by any later caller. The gate refuses an
      # unbounded approval, one not sized to the swap it guards, one whose swap is in another
      # transaction, and one paired with an exact-out leg. --self-test runs first, against one
      # fixture per shape: a gate that stopped detecting a shape must red the build rather than
      # pass quietly. Placed before the build because it is a source scan -- it needs no
      # dependencies and no compiler, and failing it early costs nothing.
      - name: zRouter allowance gate (INV-1)
        run: |
          ./scripts/zrouter-approval-gate.sh --self-test
          ./scripts/zrouter-approval-gate.sh

      - name: Build contracts
        run: forge build

      # EIP-170 size/headroom + storage-layout equality gate (noesis-091/142/148/166). Enforces the
      # invariant ERC404BondingStorage.sol documents as CI-checked: ERC404BondingInstance and
      # ERC404BondingOps must have byte-identical storage layouts, since Ops runs in the instance's
      # storage context via delegatecall. A mismatch is a storage-collision bug and must fail the job.
      - name: EIP-170 + storage-layout gate
        run: bash test/factories/erc404/eip170-diet-gate.sh

      # `ci` profile (foundry.toml): elevated fuzz depth, default invariant depth. The profile
      # MUST be named here — a profile table in foundry.toml that nothing selects has no effect
      # on this step. Invariant depth deliberately stays at the default; see the `deep` profile
      # note in foundry.toml for the measured cost of raising it.
      # Everything else is inherited from `default`, so `skip=[…RealSettlement…]` still keeps the
      # exact-0.8.26 v4 test out of this pinned-0.8.28 compile, and the test/fork/** suites still
      # self-skip at runtime (vm.skip(true) when no fork URL), so no RPC secret is needed.
      - name: Run tests
        run: FOUNDRY_PROFILE=ci forge test

      # Audit-#1 guard: the real-v4 RealSettlement regression. foundry.v4.toml enables
      # auto_detect_solc so forge selects 0.8.26 for v4-core's real PoolManager. It uses
      # an in-memory real PoolManager (not a fork), so it needs no RPC.
      - name: RealSettlement regression (real v4)
        run: FOUNDRY_CONFIG=foundry.v4.toml forge test --match-path test/hooks/UniAlignmentV4Hook_RealSettlement.t.sol
