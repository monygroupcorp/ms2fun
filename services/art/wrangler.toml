# Art delivery service — deployment template.
#
# THIS FILE CARRIES NO ACCOUNT IDENTIFIER, CREDENTIAL OR HOSTNAME, and it must stay that way
# (rth 2026-09-25: open source, and lean). A fork stands up its own with `wrangler deploy` after
# filling the two blanks below in its OWN environment; this repository never learns either value.
#
#   account_id  -> set CLOUDFLARE_ACCOUNT_ID in the environment, never here
#   route/host  -> set at deploy time, or use the workers.dev subdomain
#
# See README.md for the bucket, the lifecycle rule that makes this a cache rather than custody,
# and what the app does when no service is configured at all (it works; that is the point).

name = "noesis-art"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Width rungs this deployment will serve. MUST mirror ART_WIDTHS in app/src/lib/metadata/uri.ts —
# a width the app asks for and this does not list is refused, and the app falls back to the roster.
[vars]
ART_WIDTHS = "320,640,1024"

# CIDs this deployment refuses to redistribute — the takedown path, see README.md. Empty here on
# purpose: a denial is a decision about one piece of work on one deployment, not a value a public
# repository carries. Set it at deploy time (`wrangler deploy --var ART_DENYLIST:"<cid>,<cid>"`) or
# in the dashboard. An entry stops this service serving that CID and drops what it cached; it does
# not remove anything from IPFS, and it does not touch the app's public gateway fallback.
ART_DENYLIST = ""

# A gateway on an account YOU control, tried ahead of the public roster. Empty here for the same
# reason nothing else names a host: set it at deploy time
# (`wrangler deploy --var ART_GATEWAY_LEAD:https://<name>.mypinata.cloud`) or in the dashboard.
#
# Empty is supported and means the public roster alone. It is worth setting: the roster meters by
# client IP and the client here is a datacentre, not a visitor — measured 2026-09-29, the public
# gateways answered this worker nothing at all while serving the same CID to a laptop, so every
# card 502'd. A dedicated gateway answers because its quota belongs to the account that pins the
# art. It LEADS the roster and does not replace it; if it is down the public entries still run.
ART_GATEWAY_LEAD = ""

# The cache. `bucket_name` is a local name and not an identifier of ours; create it in your own
# account and apply the lifecycle rule from README.md, which is what bounds the bill.
[[r2_buckets]]
binding = "ART_CACHE"
bucket_name = "noesis-art-cache"
